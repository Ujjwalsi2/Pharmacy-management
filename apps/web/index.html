<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MediTrack — modern pharmacy management platform for inventory, sales, purchases and reporting." />
    <meta name="theme-color" content="#0d9488" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MediTrack — Pharmacy Management</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('meditrack-theme');
          var stored = raw ? JSON.parse(raw) : null;
          var theme = stored === 'light' || stored === 'dark' ? stored : 'system';
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
